<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Welcome | ML Studio</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f7f8ff;
            background: #0b1020;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 15% 18%, rgba(107, 86, 255, .23), transparent 38%),
                radial-gradient(ellipse at 86% 82%, rgba(26, 220, 191, .16), transparent 35%),
                #0b1020;
        }
        body::before, body::after {
            content: "";
            position: fixed;
            width: 360px;
            height: 360px;
            border: 1px solid rgba(169, 181, 255, .12);
            border-radius: 50%;
            pointer-events: none;
        }
        body::before { top: -235px; right: 10%; box-shadow: 0 0 0 38px rgba(169, 181, 255, .025), 0 0 0 78px rgba(169, 181, 255, .02); }
        body::after { bottom: -260px; left: 4%; width: 440px; height: 440px; }
        main {
            position: relative;
            width: min(100%, 690px);
            padding: clamp(38px, 8vw, 78px);
            overflow: hidden;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, .13);
            border-radius: 28px;
            background: linear-gradient(145deg, rgba(29, 37, 66, .88), rgba(16, 22, 41, .9));
            box-shadow: 0 32px 100px rgba(0, 0, 0, .45), inset 0 1px rgba(255, 255, 255, .09);
            backdrop-filter: blur(18px);
        }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            color: #b4bfdc;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .17em;
            text-transform: uppercase;
        }
        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #52e5cf;
            box-shadow: 0 0 14px #52e5cf;
        }
        h1 {
            margin: 0;
            font-size: clamp(3.2rem, 10vw, 5.8rem);
            line-height: .98;
            letter-spacing: -.07em;
            color: #d7d9ff;
            background: linear-gradient(100deg, #fff 15%, #c9caff 56%, #76ead6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            max-width: 420px;
            margin: 24px auto 34px;
            color: #a9b2ca;
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            line-height: 1.7;
        }
        .continue-link {
            display: inline-flex;
            min-height: 56px;
            align-items: center;
            justify-content: center;
            gap: 13px;
            padding: 0 28px;
            border: 1px solid rgba(255, 255, 255, .24);
            border-radius: 14px;
            background: linear-gradient(110deg, #7065ff, #4b91ff 60%, #43d6c1);
            box-shadow: 0 10px 30px rgba(76, 119, 255, .3), inset 0 1px rgba(255, 255, 255, .3);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }
        .continue-link:hover {
            transform: translateY(-3px);
            filter: brightness(1.08);
            box-shadow: 0 16px 38px rgba(76, 119, 255, .4), inset 0 1px rgba(255, 255, 255, .35);
        }
        .continue-link:focus-visible { outline: 3px solid #9bf5e9; outline-offset: 5px; }
        .arrow { font-size: 1.2rem; transition: transform .2s ease; }
        .continue-link:hover .arrow { transform: translateX(4px); }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <span class="eyebrow">Your next idea starts here</span>
        <h1>Welcome</h1>
        <p>Step into your machine learning workspace and turn data into meaningful predictions.</p>
        <a class="continue-link" href="{{ url_for('predict_datapoints') }}">Continue <span class="arrow" aria-hidden="true">→</span></a>
    </main>
</body>
</html>
